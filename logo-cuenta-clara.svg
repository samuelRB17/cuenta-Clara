<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" role="img" aria-label="Cuenta Clara">
  <!-- Fondo degradado teal -->
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F6B63"/>
      <stop offset="100%" stop-color="#0A4A45"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Base redondeada -->
  <rect x="0" y="0" width="44" height="44" rx="14" fill="url(#tealGrad)"/>
  <!-- Brillo superior interno -->
  <rect x="0" y="0" width="44" height="44" rx="14" fill="url(#centerGlow)"/>
  <!-- Sombra interna inferior -->
  <rect x="0" y="0" width="44" height="44" rx="14" fill="none" stroke="rgba(20,33,61,0.25)" stroke-width="0.5"/>
  
  <!-- Donut de reparto (conic gradient simulado con paths) -->
  <!-- Segmento blanco principal (100deg = ~28%) -->
  <path d="M22 2 C11 2 2 11 2 22 C2 27.5 4.5 32.5 8.5 36 L22 22 Z" fill="#FFFFFF" opacity="0.95"/>
  <!-- Separador fino -->
  <path d="M22 22 L25.5 10.5" stroke="rgba(15,106,99,0.3)" stroke-width="0.5" opacity="0.5"/>
  <!-- Segmento sun (60deg = ~17%) - el destacado -->
  <path d="M22 22 L25.5 10.5 L38.5 8.5" fill="#F5B83D"/>
  <!-- Separador fino -->
  <path d="M22 22 L38.5 8.5" stroke="rgba(15,106,99,0.3)" stroke-width="0.5" opacity="0.5"/>
  <!-- Segmento blanco translúcido (188deg = ~52%) -->
  <path d="M22 22 L38.5 8.5 L22 42" fill="#FFFFFF" opacity="0.5"/>
  <!-- Separador fino -->
  <path d="M22 22 L22 42" stroke="rgba(15,106,99,0.3)" stroke-width="0.5" opacity="0.5"/>
  <!-- Segmento transparente (12deg) - implícito por el resto -->
  
  <!-- Punto central sun (el "total") -->
  <circle cx="22" cy="22" r="3.5" fill="#F5B83D">
    <animate attributeName="r" values="3.5;4;3.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="22" cy="22" r="6" fill="none" stroke="rgba(15,106,99,0.6)" stroke-width="1.5"/>
</svg>